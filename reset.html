<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فرتكه | تغيير كلمة المرور</title><link rel="icon" href="logo.svg"><link rel="stylesheet" href="style.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section class="modalCard" style="max-width:520px;width:100%"><div style="text-align:center"><img src="logo.svg" style="width:74px;height:74px" alt="فرتكه"><h1>تغيير كلمة المرور</h1><p class="muted">اكتب كلمة المرور الجديدة لحسابك.</p></div><form id="resetForm"><input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="كلمة المرور الجديدة" required><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="تأكيد كلمة المرور" required><button class="primary full">حفظ كلمة المرور</button></form><div id="status" class="authStatus"></div><a href="./" class="textBtn" style="display:block;text-align:center;margin-top:14px">العودة إلى فرتكه</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const status=document.getElementById('status'),form=document.getElementById('resetForm');let sb=null;const cfg=window.FARTAKA_SUPABASE_CONFIG||{};if(window.supabase&&cfg.supabase_url&&cfg.supabase_publishable_key)sb=window.supabase.createClient(cfg.supabase_url,cfg.supabase_publishable_key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});async function boot(){if(!sb){status.textContent='الموقع غير مربوط بـ Supabase.';return}const {data}=await sb.auth.getSession();if(!data.session){status.textContent='الرابط غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا من فرتكه.';form.style.display='none';}}boot();form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){status.textContent='كلمتا المرور غير متطابقتين.';return}status.textContent='جاري حفظ كلمة المرور...';const {error}=await sb.auth.updateUser({password:a});if(error){status.textContent='تعذر تغيير كلمة المرور: '+error.message;return}status.textContent='تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول من الموقع.';form.style.display='none';await sb.auth.signOut();});</script></body></html>
